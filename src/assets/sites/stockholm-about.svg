<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#f7f7f7"/><rect width="1440" height="92" fill="#fff"/><text x="30" y="52" font-family="Georgia" font-size="30" fill="#333">Roshan Arun Artworks</text><text x="786" y="50" font-family="Arial" font-size="14" letter-spacing="2">HOME      GALLERY      ABOUT      EXHIBITIONS      CONTACT</text><text x="108" y="134" font-family="Georgia" font-size="22">About Roshan</text><text x="108" y="184" font-family="Arial" font-size="19" fill="#39485a">As a Stockholm based artist and engineer, I try to find inspiration</text><text x="108" y="216" font-family="Arial" font-size="19" fill="#39485a">in everything around me. My art moves between abstract energy</text><text x="108" y="248" font-family="Arial" font-size="19" fill="#39485a">and figurative stories.</text><text x="108" y="318" font-family="Arial" font-size="19" fill="#39485a">From finding the balance between colours to building thought-</text><text x="108" y="350" font-family="Arial" font-size="19" fill="#39485a">provoking ideas, my ambition is to explore contrast.</text><rect x="872" y="180" width="284" height="380" rx="20" fill="#d9e7f8"/><rect x="912" y="220" width="204" height="300" rx="16" fill="#3479c8"/><circle cx="1014" cy="330" r="62" fill="#1b232c"/><rect x="954" y="386" width="120" height="108" rx="42" fill="#3f536f"/><text x="108" y="440" font-family="Arial" font-size="19" fill="#39485a">Every piece is one-of-a-kind and comes with a certificate of</text><text x="108" y="472" font-family="Arial" font-size="19" fill="#39485a">authenticity. Feel free to reach out if something speaks to you.</text></svg>